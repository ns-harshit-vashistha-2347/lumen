services:
  postgres:
    image: postgres:16-alpine
    container_name: world_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: world_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  chromadb:
    image: chromadb/chroma:latest
    container_name: world_chromadb
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: world-backend:latest
    container_name: world_backend
    restart: unless-stopped
    command: >
      sh -c "alembic upgrade head &&
             uvicorn main:app --host 0.0.0.0 --port 8080 --workers 2"
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      CHROMA_HOST: chromadb
      HF_HOME: /root/.cache/huggingface
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - .:/app
      - uploads_data:/data/uploads
      - hf_cache:/root/.cache/huggingface
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_started

  celery_worker_ingestion:
    build:
      context: .
      dockerfile: Dockerfile
    image: world-backend:latest
    container_name: world_celery_ingestion
    restart: unless-stopped
    command: celery -A src.celery_app worker -Q ingestion -n ingestion_worker@%h --loglevel=info
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      CHROMA_HOST: chromadb
      HF_HOME: /root/.cache/huggingface
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - .:/app
      - uploads_data:/data/uploads
      - hf_cache:/root/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_started

  flower:
    build:
      context: .
      dockerfile: Dockerfile
    image: world-backend:latest
    container_name: world_flower
    restart: unless-stopped
    command: celery -A src.celery_app flower --port=5555
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      CHROMA_HOST: chromadb
      HF_HOME: /root/.cache/huggingface
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
      HF_TOKEN: ${HF_TOKEN:-}
    ports:
      - "5555:5555"
    depends_on:
      - redis
      - celery_worker_ingestion

volumes:
  postgres_data:
  chroma_data:
  uploads_data:
  hf_cache:
